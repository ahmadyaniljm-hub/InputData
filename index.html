<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol Proteksi Password</title>
    <style>
        /* Mengatur halaman agar memenuhi layar dan memposisikan konten di tengah */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center; /* Mengetengahkan secara horizontal */
            align-items: center; /* Mengetengahkan secara vertikal */
            background-color: #f5f5f5; /* Warna latar belakang halaman */
        }
        /* Kontainer Utama (Menyusun Gambar dan Kelompok Tombol secara vertikal) */
        .wrapper-utama {
            display: flex;
            flex-direction: column;
            align-items: center; /* Memastikan gambar dan tombol sejajar di tengah */
            gap: 20px; /* Jarak antara gambar dan tombol di bawahnya */
            width: 100%;
            max-width: 600px; /* Batas lebar maksimal konten */
            padding: 20px;
            box-sizing: border-box;
        }
        /* Pengaturan File Gambar JPEG */
        .gambar-atas {
            max-width: 300px; /* Batas lebar maksimal gambar */
            height: auto; /* Menjaga proporsi gambar */
            border-radius: 8px; /* Membuat sudut gambar sedikit melengkung */
        }
        /* Pembungkus utama tombol (Vertikal) */
        .container-tombol {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Jarak vertikal antar susunan kelompok tombol */
            width: 100%;
        }
        /* Pembungkus baris tombol Piutang */
        .baris-piutang {
            display: flex;
            justify-content: center;
            gap: 10px; /* Jarak horizontal antar tombol */
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Kontainer Utama -->
    <div class="wrapper-utama">
        
        <!-- TAG GAMBAR JPEG -->
        <img src="foto.jpeg" alt="Logo atau Banner" class="gambar-atas">

        <!-- Pembungkus Tombol -->
        <div class="container-tombol">
            
            <!-- Tombol Input Data di Paling Atas -->
            <button onclick="window.open('https://google.com')" style="padding: 12px 24px; background-color: #1a73e8; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 200px;">
                Input Data
            </button>

            <!-- BARIS PIUTANG PERTAMA (2 Tombol) -->
            <div class="baris-piutang">
                <button onclick="Password1()" style="padding: 12px 20px; background-color: #107c41; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 120px;">
                    Piutang A-D
                </button>
                <button onclick="Password2()" style="padding: 12px 20px; background-color: #107c41; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 120px;">
                    Piutang E-H
                </button>
            </div>

            <!-- BARIS PIUTANG KEDUA (3 Tombol) -->
            <div class="baris-piutang">
                <button onclick="Password3()" style="padding: 12px 20px; background-color: #107c41; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 110px;">
                    Piutang I-N
                </button>
                <button onclick="Password4()" style="padding: 12px 20px; background-color: #107c41; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 110px;">
                    Piutang O-S
                </button>
                <button onclick="Password5()" style="padding: 12px 20px; background-color: #107c41; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 110px;">
                    Piutang T-Z
                </button>
            </div>

        </div>
    </div>

    <!-- Script JavaScript untuk Cek Password Tombol -->
    <script>
        function Password1() {
            const passwordBenar = "SEMANGAT2026";
            const inputUser = prompt("Masukkan password untuk mengakses file:");
            if (inputUser === null) { return; }
            else if (inputUser === passwordBenar) { window.open("https://docs.google.com/spreadsheets/d/1Pg2M5tYvujltNK64mpf-ftm1_GdlMUANKC09MNGo3IA/edit?usp=sharing"); }
            else { alert("Password salah! Akses ditolak."); }
        }

        }
    </script>
</body>
</html>
