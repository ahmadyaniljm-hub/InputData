<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tombol Proteksi Password</title>

    <style>
        /* ==============================
           DASAR HALAMAN
        ============================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f5f5f5;

            font-family: Arial, Helvetica, sans-serif;

            padding: 20px 12px;
        }


        /* ==============================
           KONTENER UTAMA
        ============================== */

        .wrapper-utama {
            width: 100%;
            max-width: 600px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 25px;
        }


        /* ==============================
           GAMBAR
        ============================== */

        .gambar-atas {
            display: block;

            width: auto;
            max-width: 100%;
            height: auto;

            max-height: 300px;

            border-radius: 8px;

            object-fit: contain;
        }


        /* ==============================
           KONTENER TOMBOL
        ============================== */

        .container-tombol {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 12px;
        }


        /* ==============================
           SEMUA TOMBOL
        ============================== */

        button {
            min-height: 48px;

            padding: 12px 18px;

            border: none;
            border-radius: 7px;

            color: white;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.1s ease,
                box-shadow 0.1s ease,
                opacity 0.1s ease;
        }

        button:active {
            transform: scale(0.96);
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.15);
        }

        button:hover {
            opacity: 0.92;
        }


        /* ==============================
           TOMBOL INPUT DATA
        ============================== */

        .btn-input {
            width: 220px;
            max-width: 100%;

            background-color: #1a73e8;
        }


        /* ==============================
           BARIS TOMBOL PIUTANG
        ============================== */

        .baris-piutang {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: stretch;

            gap: 10px;
        }


        /* Tombol Piutang */

        .btn-piutang {
            flex: 1;

            max-width: 180px;

            background-color: #107c41;
        }


        /* ==============================
           HP / LAYAR KECIL
        ============================== */

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;
            }

            .wrapper-utama {
                max-width: 100%;
                gap: 20px;
            }

            .gambar-atas {
                width: 100%;
                max-width: 300px;
                max-height: 250px;
            }

            .container-tombol {
                width: 100%;
                gap: 10px;
            }

            .baris-piutang {
                width: 100%;
                gap: 8px;
            }

            .btn-piutang {
                width: 100%;
                min-width: 0;
                max-width: none;

                padding: 13px 6px;

                font-size: 14px;
            }

            .btn-input {
                width: 100%;
                max-width: 320px;
            }
        }


        /* ==============================
           HP SANGAT KECIL
           Contoh: 320px - 360px
        ============================== */

        @media (max-width: 360px) {

            body {
                padding-left: 8px;
                padding-right: 8px;
            }

            .baris-piutang {
                gap: 5px;
            }

            .btn-piutang {
                padding: 12px 3px;

                font-size: 12px;
            }

            .btn-input {
                font-size: 14px;
            }
        }


        /* ==============================
           LAYAR LEBAR
        ============================== */

        @media (min-width: 601px) {

            .btn-piutang {
                min-width: 120px;
            }
        }

    </style>
</head>


<body>

    <!-- ==============================
         KONTENER UTAMA
    ============================== -->

    <div class="wrapper-utama">


        <!-- ==============================
             GAMBAR
        ============================== -->

        <img
            src="foto.jpeg"
            alt="Logo atau Banner"
            class="gambar-atas"
        >


        <!-- ==============================
             TOMBOL
        ============================== -->

        <div class="container-tombol">


            <!-- ==========================
                 INPUT DATA
            =========================== -->

            <button
                class="btn-input"
                onclick="window.open(
                    'https://docs.google.com/spreadsheets/d/1ORfNIVa93L5hKYiWKCAMPe-iitrZpyePC8uGYa5oZ48/edit?usp=drive_link',
                    '_blank'
                )"
            >
                Input Data
            </button>


            <!-- ==========================
                 PIUTANG A-D / E-H
            =========================== -->

            <div class="baris-piutang">

                <button
                    class="btn-piutang"
                    onclick="Password1()"
                >
                    Piutang A-D
                </button>

                <button
                    class="btn-piutang"
                    onclick="Password2()"
                >
                    Piutang E-H
                </button>

            </div>


            <!-- ==========================
                 PIUTANG I-N / O-S / T-Z
            =========================== -->

            <div class="baris-piutang">

                <button
                    class="btn-piutang"
                    onclick="Password3()"
                >
                    Piutang I-N
                </button>

                <button
                    class="btn-piutang"

                >
                    Piutang O-S
                </button>

                <button
                    class="btn-piutang"
                    onclick="Password5()"
                >
                    Piutang T-Z
                </button>

            </div>


        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT PASSWORD
    ============================== -->

           PASSWORD 1
           PIUTANG A-D

            );
